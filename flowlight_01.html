<script>
const $ = id => document.getElementById(id);

// ── Easing ──

// cubic-bezier 解算器（CSS 標準，Newton's method）
function mkCubicBezier(x1, y1, x2, y2) {
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  const cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  function sx(t){ return ((ax*t+bx)*t+cx)*t; }
  function sy(t){ return ((ay*t+by)*t+cy)*t; }
  function dsx(t){ return (3*ax*t+2*bx)*t+cx; }
  function tForX(x){
    let t=x;
    for(let i=0;i<8;i++){
      const dx=sx(t)-x; if(Math.abs(dx)<1e-7) return t;
      const d=dsx(t); if(Math.abs(d)<1e-7) break;
      t-=dx/d;
    }
    // fallback bisect
    let lo=0,hi=1; t=x;
    while(lo<hi){ const mid=(lo+hi)/2; sx(mid)<x?lo=mid:hi=mid; if(hi-lo<1e-5) break; }
    return (lo+hi)/2;
  }
  return x=>{ if(x<=0) return 0; if(x>=1) return 1; return sy(tForX(x)); };
}

// Bezier 預設值 (x1,y1,x2,y2) — null 表示特殊曲線
const BZ_PRESETS = {
  linear:         [0,   0,   1,   1  ],
  ease:           [0.25,0.1, 0.25,1.0],
  easeIn:         [0.42,0,   1.0, 1.0],
  easeOut:        [0.0, 0.0, 0.58,1.0],
  easeInOut:      [0.42,0,   0.58,1.0],
  easeOutBack:    null,
  easeInBack:     null,
  easeOutElastic: null,
  stepStart:      null,
  stepEnd:        null,
  steps4:         null,
  custom:         null, // 使用目前 bzState
};

// 特殊曲線函數（超出 bezier 範圍）
const SPECIAL_FNS = {
  easeOutBack:    t=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  easeInBack:     t=>{ const c1=1.70158,c3=c1+1; return c3*t*t*t-c1*t*t; },
  easeOutElastic: t=>{ if(t===0||t===1) return t; const c4=(2*Math.PI)/3; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1; },
  stepStart:      t=>t<=0?0:1,
  stepEnd:        t=>t<1?0:1,
  steps4:         t=>Math.floor(t*4)/4,
};

// 目前 bezier 把手狀態
let bzState = { x1:0, y1:0, x2:0.58, y2:1 };

function getEasingFn(){
  const preset = $('v-easing').value;
  if(SPECIAL_FNS[preset]) return SPECIAL_FNS[preset];
  // bezier
  const {x1,y1,x2,y2} = bzState;
  return mkCubicBezier(x1,y1,x2,y2);
}

function getEasingIntensity(){ return parseFloat($('v-easing-intensity').value)/100; }

function applyEasing(t){
  const fn = getEasingFn();
  const k  = getEasingIntensity();
  const raw = fn(Math.max(0,Math.min(1,t)));
  return t + (raw - t) * k;
}

// ── Bezier Canvas Editor ──
let easingAnimId = null;
let easingT = 0;
let bzDragging = null; // 'p1' | 'p2' | null

function bzToCanvas(bx, by, W, H, pad, yMin, yMax){
  return [
    pad + bx * (W - pad*2),
    H - pad - (by - yMin) / (yMax - yMin) * (H - pad*2)
  ];
}
function canvasToBz(cx, cy, W, H, pad, yMin, yMax){
  return [
    Math.max(0, Math.min(1, (cx - pad) / (W - pad*2))),
    yMin + (H - pad - cy) / (H - pad*2) * (yMax - yMin)
  ];
}

function drawBezierEditor(dot01) {
  const c = $('bezier-canvas');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = 18;
  const yMin = -0.25, yMax = 1.25; // 允許 overshoot

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1e1e22'; ctx.fillRect(0,0,W,H);

  // 方格 grid
  ctx.strokeStyle='rgba(232,213,163,0.08)'; ctx.lineWidth=0.5; ctx.setLineDash([2,3]);
  [0,0.25,0.5,0.75,1].forEach(v=>{
    const [,gy]=bzToCanvas(0,v,W,H,pad,yMin,yMax);
    const [,gy0]=bzToCanvas(0,0,W,H,pad,yMin,yMax);
    const [,gy1]=bzToCanvas(0,1,W,H,pad,yMin,yMax);
    ctx.beginPath(); ctx.moveTo(pad,gy); ctx.lineTo(W-pad,gy); ctx.stroke();
    // 垂直格
    const gx = pad + v*(W-pad*2);
    ctx.beginPath(); ctx.moveTo(gx,gy1-4); ctx.lineTo(gx,gy0+4); ctx.stroke();
  });
  ctx.setLineDash([]);

  // 0%/100% 標記線（實線，稍亮）
  const [,y0c]=bzToCanvas(0,0,W,H,pad,yMin,yMax);
  const [,y1c]=bzToCanvas(0,1,W,H,pad,yMin,yMax);
  ctx.strokeStyle='rgba(232,213,163,0.2)'; ctx.lineWidth=0.75;
  ctx.beginPath(); ctx.moveTo(pad,y0c); ctx.lineTo(W-pad,y0c); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad,y1c); ctx.lineTo(W-pad,y1c); ctx.stroke();

  // diagonal linear 參考線
  ctx.beginPath(); ctx.strokeStyle='rgba(232,213,163,0.2)'; ctx.lineWidth=0.8; ctx.setLineDash([3,4]);
  const [lx0,ly0]=bzToCanvas(0,0,W,H,pad,yMin,yMax);
  const [lx1,ly1]=bzToCanvas(1,1,W,H,pad,yMin,yMax);
  ctx.moveTo(lx0,ly0); ctx.lineTo(lx1,ly1); ctx.stroke();
  ctx.setLineDash([]);

  const preset = $('v-easing').value;
  const isSpecial = !!SPECIAL_FNS[preset];

  // 把手連線 + 把手圓
  if(!isSpecial){
    const [p1x,p1y]=bzToCanvas(bzState.x1,bzState.y1,W,H,pad,yMin,yMax);
    const [p2x,p2y]=bzToCanvas(bzState.x2,bzState.y2,W,H,pad,yMin,yMax);
    // P0 → P1 連線
    ctx.beginPath(); ctx.strokeStyle='rgba(232,213,163,0.35)'; ctx.lineWidth=1;
    ctx.moveTo(lx0,ly0); ctx.lineTo(p1x,p1y); ctx.stroke();
    // P3 → P2 連線
    ctx.beginPath();
    ctx.moveTo(lx1,ly1); ctx.lineTo(p2x,p2y); ctx.stroke();
    // P1 把手
    ctx.beginPath(); ctx.arc(p1x,p1y,5.5,0,Math.PI*2);
    ctx.strokeStyle='#e8d5a3'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(232,213,163,0.15)'; ctx.fill();
    // P2 把手
    ctx.beginPath(); ctx.arc(p2x,p2y,5.5,0,Math.PI*2);
    ctx.strokeStyle='#e8d5a3'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(232,213,163,0.15)'; ctx.fill();
  }

  // Bezier / Special 曲線
  const fn = isSpecial ? SPECIAL_FNS[preset] : mkCubicBezier(bzState.x1,bzState.y1,bzState.x2,bzState.y2);
  const k  = getEasingIntensity();
  ctx.beginPath(); ctx.strokeStyle='#e8d5a3'; ctx.lineWidth=2;
  for(let i=0;i<=300;i++){
    const t=i/300;
    const raw = fn(Math.max(0,Math.min(1,t)));
    const fy  = t + (raw - t)*k; // intensity blend
    const [cx2,cy2]=bzToCanvas(t,fy,W,H,pad,yMin,yMax);
    i===0?ctx.moveTo(cx2,cy2):ctx.lineTo(cx2,cy2);
  }
  ctx.stroke();

  // 固定錨點 P0, P3
  [[0,0],[1,1]].forEach(([bx,by])=>{
    const [ax,ay]=bzToCanvas(bx,by,W,H,pad,yMin,yMax);
    ctx.beginPath(); ctx.arc(ax,ay,4,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
  });

  // 移動點（播放中）
  if(dot01!=null){
    const dt=Math.max(0,Math.min(1,dot01));
    const raw=fn(Math.max(0,Math.min(1,dt)));
    const fy=dt+(raw-dt)*k;
    const [dx,dy]=bzToCanvas(dt,fy,W,H,pad,yMin,yMax);
    // 垂直 guide
    const [,bot]=bzToCanvas(dt,yMin,W,H,pad,yMin,yMax);
    ctx.beginPath(); ctx.strokeStyle='rgba(232,213,163,0.3)'; ctx.lineWidth=0.75; ctx.setLineDash([2,3]);
    ctx.moveTo(dx,bot); ctx.lineTo(dx,dy); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(dx,dy,5,0,Math.PI*2);
    ctx.fillStyle='#e8d5a3'; ctx.fill();
  }

  // 標記文字 0% / 100%
  ctx.fillStyle='rgba(232,213,163,0.35)'; ctx.font='9px DM Mono,monospace';
  ctx.fillText('0%', 2, y0c+3);
  ctx.fillText('100%', 2, y1c+3);

  // 更新座標顯示
  if(!isSpecial){
    const r=n=>+n.toFixed(3);
    $('bz-coords').textContent=`cubic-bezier(${r(bzState.x1)}, ${r(bzState.y1)}, ${r(bzState.x2)}, ${r(bzState.y2)})`;
  } else {
    $('bz-coords').textContent=`special: ${preset}`;
  }
}

// 把手拖拉互動
(()=>{
  const c=$('bezier-canvas');
  const pad=18, yMin=-0.25, yMax=1.25;

  function getHandle(clientX, clientY){
    const rect=c.getBoundingClientRect();
    const scaleX=c.width/rect.width, scaleY=c.height/rect.height;
    const cx=(clientX-rect.left)*scaleX, cy=(clientY-rect.top)*scaleY;
    const W=c.width, H=c.height;
    const [p1x,p1y]=bzToCanvas(bzState.x1,bzState.y1,W,H,pad,yMin,yMax);
    const [p2x,p2y]=bzToCanvas(bzState.x2,bzState.y2,W,H,pad,yMin,yMax);
    const d1=Math.hypot(cx-p1x,cy-p1y);
    const d2=Math.hypot(cx-p2x,cy-p2y);
    if(d1<12 && d1<=d2) return 'p1';
    if(d2<12) return 'p2';
    return null;
  }

  function applyDrag(clientX, clientY){
    const rect=c.getBoundingClientRect();
    const scaleX=c.width/rect.width, scaleY=c.height/rect.height;
    const cx=(clientX-rect.left)*scaleX, cy=(clientY-rect.top)*scaleY;
    const [bx,by]=canvasToBz(cx,cy,c.width,c.height,pad,yMin,yMax);
    if(bzDragging==='p1'){ bzState.x1=bx; bzState.y1=Math.max(-0.5,Math.min(1.5,by)); }
    else if(bzDragging==='p2'){ bzState.x2=bx; bzState.y2=Math.max(-0.5,Math.min(1.5,by)); }
    // 切換到 custom
    $('v-easing').value='custom';
    drawBezierEditor(easingAnimId!==null?easingT:null);
  }

  c.addEventListener('mousedown', e=>{
    const h=getHandle(e.clientX,e.clientY);
    if(!h) return;
    bzDragging=h; e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{ if(bzDragging) applyDrag(e.clientX,e.clientY); });
  window.addEventListener('mouseup', ()=>{ bzDragging=null; });

  c.addEventListener('touchstart', e=>{
    const t=e.touches[0];
    const h=getHandle(t.clientX,t.clientY);
    if(!h) return;
    bzDragging=h; e.preventDefault();
  },{passive:false});
  window.addEventListener('touchmove', e=>{ if(bzDragging){ applyDrag(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); } },{passive:false});
  window.addEventListener('touchend', ()=>{ bzDragging=null; });

  // 游標提示
  c.addEventListener('mousemove', e=>{
    const preset=$('v-easing').value;
    if(!!SPECIAL_FNS[preset]){ c.style.cursor='default'; return; }
    c.style.cursor=getHandle(e.clientX,e.clientY)?'grab':'default';
  });
})();

function startEasingAnim(){
  stopEasingAnim();
  easingT=0;
  function loop(ts){
    easingT=(ts/2500)%1;
    drawBezierEditor(easingT);
    easingAnimId=requestAnimationFrame(loop);
  }
  easingAnimId=requestAnimationFrame(loop);
}
function stopEasingAnim(){
  if(easingAnimId){ cancelAnimationFrame(easingAnimId); easingAnimId=null; }
  drawBezierEditor(null);
}

// 預設切換 → 更新 bzState 把手
$('v-easing').onchange=()=>{
  const preset=$('v-easing').value;
  const bz=BZ_PRESETS[preset];
  if(bz){ bzState={x1:bz[0],y1:bz[1],x2:bz[2],y2:bz[3]}; }
  drawBezierEditor(null);
  if(playing) startEasingAnim();
};

// Intensity 控制
(()=>{
  const rng=$('r-easing-intensity'), num=$('v-easing-intensity');
  rng.oninput=()=>{ num.value=rng.value; drawBezierEditor(easingAnimId!==null?easingT:null); };
  const applyNum=()=>{
    let v=parseInt(num.value); if(isNaN(v)) return;
    v=Math.max(0,Math.min(200,v)); num.value=v; rng.value=v;
    drawBezierEditor(easingAnimId!==null?easingT:null);
  };
  num.onchange=applyNum;
  num.onkeydown=e=>{ if(e.key==='Enter') applyNum(); };
})();

drawBezierEditor(null);

// ── WebGL ──
const canvas=$('glcanvas');
const glOpts={premultipliedAlpha:false,preserveDrawingBuffer:true,alpha:true};
const gl=canvas.getContext('webgl',glOpts)||canvas.getContext('experimental-webgl',glOpts);
const cvStreak=$('cv-streak'), cvAdd=$('cv-add');
if(!gl){ alert('瀏覽器不支援 WebGL'); }

const VS=`
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){
  v_uv=vec2(a_pos.x*0.5+0.5,0.5-a_pos.y*0.5);
  gl_Position=vec4(a_pos,0.0,1.0);
}`;

// Softness:
//   0 = 完全硬邊（step函數），光條邊界像刀切
//   1 = 完全羽化（smoothstep），邊緣大幅模糊漸層
// 做法：用 edgeWidth 控制 smoothstep 的過渡帶寬
//   edgeWidth→0 時 step 極銳利，→大值時羽化寬
const FS=`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform float u_angle;
uniform float u_spacing;
uniform float u_size;
uniform float u_speed;
uniform float u_time;
uniform float u_intensity;
uniform float u_pos;
uniform vec4  u_color;
uniform float u_aspect;
uniform float u_softness;

void main(){
  vec2 uv=v_uv;
  vec4 texCol=texture2D(u_tex,uv);
  float r=texCol.r,g=texCol.g,b=texCol.b,a=texCol.a;

  float rad=u_angle*(3.14159265/180.0);
  float cosA=cos(rad),sinA=sin(rad);
  vec2 c=uv-vec2(0.5);
  c.x*=u_aspect;
  float ru=dot(vec2(cosA,-sinA),c)+0.5;

  float gray=r*0.299+g*0.587+b*0.114;
  ru+=gray*u_intensity;

  float phase=(ru+u_time*u_speed+u_pos)*u_spacing;
  float f=fract(phase);
  // tri: 0 at centre of streak, 1 at edges
  float tri=abs(f-0.5)*2.0;

  // half-width of streak in [0,1] phase space
  float halfW=clamp(u_size,0.0,1.0);

  // edgeWidth: 0 → knife-sharp,  grows with softness
  // softness=0 → edgeWidth=0.0 (pure step)
  // softness=1 → edgeWidth=halfW (full feather across whole streak)
  float edgeWidth=u_softness*halfW;
  float lo=1.0-halfW-edgeWidth;
  float hi=1.0-halfW+edgeWidth;
  float mask;
  if(edgeWidth<0.0001){
    mask=tri<=1.0-halfW?1.0:0.0;
  } else {
    mask=1.0-smoothstep(lo,hi,tri);
  }

  gl_FragColor=vec4(1.0,1.0,1.0,mask*a*u_color.a);
}`;

function mkShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

const U={};
['u_angle','u_spacing','u_size','u_speed','u_time','u_intensity',
 'u_pos','u_color','u_tex','u_aspect','u_softness']
  .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.uniform1i(U['u_tex'],0);

let imgLoaded=false, srcImg=null;
let animId=null, playing=false;
let playStartWall=null; // wall-clock ms when play started
let playAccum=0;        // accumulated virtual time before last stop

// ── Sliders ──
const sliders=[
  ['r-ang','v-ang'],['r-spc','v-spc'],['r-sz','v-sz'],
  ['r-spd','v-spd'],['r-pos','v-pos'],['r-int','v-int'],
  ['r-alpha','v-alpha'],['r-soft','v-soft'],
];
sliders.forEach(([rid,nid])=>{
  const range=$(rid), num=$(nid);
  if(!range||!num) return;
  range.oninput=()=>{ num.value=range.value; if(imgLoaded&&!playing) render(playAccum); };
  const applyNum=()=>{
    let v=parseFloat(num.value);
    if(isNaN(v)) return;
    v=Math.max(parseFloat(range.min),Math.min(parseFloat(range.max),v));
    num.value=v; range.value=v;
    if(imgLoaded&&!playing) render(playAccum);
  };
  num.onchange=applyNum;
  num.onkeydown=e=>{ if(e.key==='Enter') applyNum(); };
});

// ── Upload ──
$('fin').onchange=e=>{ const f=e.target.files[0]; if(f) loadFile(f); };

function loadFile(f){
  const img=new Image();
  img.onload=()=>{
    srcImg=img;
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    const maxSide=800;
    const sc=Math.min(maxSide/img.naturalWidth,maxSide/img.naturalHeight,1);
    canvas.width=Math.round(img.naturalWidth*sc);
    canvas.height=Math.round(img.naturalHeight*sc);
    cvStreak.width=cvAdd.width=canvas.width;
    cvStreak.height=cvAdd.height=canvas.height;
    gl.viewport(0,0,canvas.width,canvas.height);
    imgLoaded=true; playAccum=0; playStartWall=null;
    $('drop-zone').classList.add('hidden');
    $('canvas-wrap').style.display='flex';
    ['btn-play','btn-reup','btn-exp-sheet','btn-exp-seq'].forEach(id=>$(id).disabled=false);
    render(0);
    setStatus(`${img.naturalWidth}×${img.naturalHeight}`);
  };
  img.onerror=()=>setStatus('圖片載入失敗，請換一張');
  img.src=URL.createObjectURL(f);
}

// ── Render ──
// virtualTime: 已經套用 easing 後的「光條位移時間」
function render(virtualTime){
  if(!imgLoaded) return;
  gl.viewport(0,0,canvas.width,canvas.height);
  const fa=parseFloat($('r-alpha').value);
  const softRaw=parseFloat($('r-soft').value);
  // softness: 1→0.0(銳利), 100→1.0(全羽化)
  const softness=(softRaw-1)/99.0;
  // size: 轉成 0~1 half-width
  // r-sz: -100~100, 我們把 0 對應 half-width=0.4, 範圍縮放
  const szRaw=parseFloat($('r-sz').value);
  const halfW=0.4+szRaw/100.0*0.4; // -100→0.0, 0→0.4, 100→0.8
  gl.uniform1f(U['u_angle'],   parseFloat($('r-ang').value));
  gl.uniform1f(U['u_spacing'], parseFloat($('r-spc').value));
  gl.uniform1f(U['u_size'],    halfW);
  gl.uniform1f(U['u_speed'],   parseFloat($('r-spd').value));
  gl.uniform1f(U['u_time'],    virtualTime);
  gl.uniform1f(U['u_intensity'],parseFloat($('r-int').value)/10.0);
  gl.uniform1f(U['u_pos'],     parseFloat($('r-pos').value));
  gl.uniform4f(U['u_color'],1.0,1.0,1.0,fa);
  gl.uniform1f(U['u_aspect'],  canvas.width/canvas.height);
  gl.uniform1f(U['u_softness'],softness);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  updatePreviews();
}

function updatePreviews(){
  const W=canvas.width,H=canvas.height;
  const sctx=cvStreak.getContext('2d');
  sctx.clearRect(0,0,W,H); sctx.drawImage(canvas,0,0);
  const actx=cvAdd.getContext('2d');
  actx.clearRect(0,0,W,H);
  actx.drawImage(srcImg,0,0,W,H);
  actx.globalCompositeOperation='screen';
  actx.drawImage(canvas,0,0);
  actx.globalCompositeOperation='source-over';
}

// ── Play / Easing loop ──
// Easing 作用在「時間進度」上：
// 每幀計算 wallDelta，用 easing 函數求「此時刻的速度倍率」
// 讓光條在一個週期內（固定1秒）加減速
const PERIOD=2.0; // easing 週期秒數
function easingSpeed(wallT){
  // 取目前週期進度 t∈[0,1]，求 easing 斜率（導數）作為速度倍率
  const fn=getEasing();
  const t=(wallT%PERIOD)/PERIOD;
  const eps=0.001;
  const t1=Math.min(t+eps,1.0);
  const slope=(fn(t1)-fn(Math.max(t-eps,0)))/(2*eps*PERIOD||eps);
  // 歸一化：linear 斜率=1/PERIOD，我們讓 linear 保持原速
  return slope*PERIOD;
}

function togglePlay(){ playing?stopPlay():startPlay(); }

function startPlay(){
  if(!imgLoaded){ setStatus('請先上傳圖片'); return; }
  playing=true;
  $('btn-play').textContent='■ 停止';
  playStartWall=performance.now();
  startEasingAnim();
  (function loop(now){
    const wallSec=(now-playStartWall)/1000;
    // virtualTime: 積分 easing 速度
    // 簡單方式：virtualTime = playAccum + integral
    // 我們用數值積分（cumulative sum in loop）→
    // 每幀直接用 wallSec 當輸入給 easing，輸出當 multiplier
    // 讓 virtualTime = playAccum + easedWallSec
    // easedWallSec: 把 wallSec 套上 easing（讓週期內速度起伏）
    const cycles=Math.floor(wallSec/PERIOD);
    const frac=(wallSec%PERIOD)/PERIOD;
    const easedSec=(cycles+applyEasing(frac))*PERIOD;
    render(playAccum+easedSec);
    // 更新 easing dot（0~1 週期進度）
    easingT=frac;
    animId=requestAnimationFrame(loop);
  })(performance.now());
}

function stopPlay(){
  playing=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  // 保存目前 virtualTime
  if(playStartWall!==null){
    const wallSec=(performance.now()-playStartWall)/1000;
    const cycles=Math.floor(wallSec/PERIOD);
    const frac=(wallSec%PERIOD)/PERIOD;
    playAccum+=(cycles+applyEasing(frac))*PERIOD;
    playStartWall=null;
  }
  stopEasingAnim();
  $('btn-play').textContent='▶ 預覽';
}

function reupload(){
  stopPlay(); playAccum=0; playStartWall=null; imgLoaded=false;
  $('drop-zone').classList.remove('hidden');
  $('canvas-wrap').style.display='none';
  ['btn-play','btn-reup','btn-exp-sheet','btn-exp-seq'].forEach(id=>$(id).disabled=true);
  setStatus('準備就緒');
}

// ── Export ──
async function exportSheet(mode){
  if(!imgLoaded){ setStatus('請先上傳圖片'); return; }
  stopPlay();
  const posStart=parseFloat($('v-pos-start').value);
  const posEnd=parseFloat($('v-pos-end').value);
  const rows=Math.max(1,parseInt($('v-rows').value)||1);
  const cols=Math.max(1,parseInt($('v-cols').value)||1);
  const totalFrames=rows*cols;
  const fw=canvas.width, fh=canvas.height;
  const frames=[];
  for(let i=0;i<totalFrames;i++){
    const tLin=totalFrames>1?i/(totalFrames-1):0;
    const tEased=applyEasing(Math.max(0,Math.min(1,tLin)));
    const pos=posStart+(posEnd-posStart)*tEased;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U['u_pos'],pos);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    const tmp=document.createElement('canvas');
    tmp.width=fw; tmp.height=fh;
    tmp.getContext('2d').drawImage(canvas,0,0);
    frames.push(tmp);
    setStatus(`產生幀 ${i+1}/${totalFrames}…`);
    await new Promise(r=>setTimeout(r,0));
  }
  gl.uniform1f(U['u_pos'],parseFloat($('r-pos').value));

  if(mode==='sheet'){
    const sheet=document.createElement('canvas');
    sheet.width=fw*cols; sheet.height=fh*rows;
    const sctx=sheet.getContext('2d');
    frames.forEach((f,i)=>sctx.drawImage(f,(i%cols)*fw,Math.floor(i/cols)*fh));
    const a=document.createElement('a');
    a.download='flowlight_sheet.png'; a.href=sheet.toDataURL('image/png'); a.click();
    setStatus(`完成！合圖 ${totalFrames} 幀 (${rows}×${cols}) 已下載`);
  } else {
    const zip=new JSZip();
    const pad=String(totalFrames).length;
    const blobs=await Promise.all(frames.map(f=>new Promise(res=>f.toBlob(res,'image/png'))));
    for(let i=0;i<blobs.length;i++){
      zip.file(`flowlight_${String(i+1).padStart(pad,'0')}.png`,await blobs[i].arrayBuffer());
      setStatus(`打包幀 ${i+1}/${totalFrames}…`);
      await new Promise(r=>setTimeout(r,0));
    }
    setStatus('壓縮中…');
    const zipBlob=await zip.generateAsync({type:'blob',compression:'STORE'});
    const a=document.createElement('a');
    a.download='flowlight_frames.zip'; a.href=URL.createObjectURL(zipBlob); a.click();
    URL.revokeObjectURL(a.href);
    setStatus(`完成！散圖 ${totalFrames} 幀已打包下載`);
  }
  render(playAccum);
}

function setStatus(msg){ $('status').textContent=msg; }

document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/')) loadFile(f);
});
</script>
